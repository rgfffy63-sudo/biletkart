<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f2b">
<meta name="description" content="БилетКарт — подготовка к экзаменам по билетам: карточки, интервальные повторения и ИИ по твоим конспектам">
<title>БилетКарт</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
/* Мягкий неон: вечернее небо над городом. cyan — основные действия, pink — всё, что делает ИИ, yellow — Pro и подсветки */
:root{
  --bg:#140f2b; --bg2:#1b1438; --panel:rgba(38,28,74,.62); --panel-solid:#231a45; --panel2:rgba(56,42,104,.55);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#f3eeff; --muted:#ab9fd0; --dim:#7a6ea3;
  --cyan:#5fe3ff; --pink:#ff6fae; --yellow:#ffe46b; --violet:#9b7bff; --good:#74f0bd; --bad:#ff7b95; --amber:#ffc46b;
  --lv0:rgba(255,255,255,.1);
  --r:16px; --r-sm:10px;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 12px 40px rgba(8,2,28,.45);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15.5px/1.6 var(--f-body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(255,111,174,.28), transparent 65%),
    radial-gradient(800px 500px at -10% 110%, rgba(95,227,255,.20), transparent 60%),
    radial-gradient(500px 300px at 60% 115%, rgba(255,228,107,.12), transparent 70%),
    linear-gradient(180deg,#171033 0%,#140f2b 45%,#1a1236 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse at 100% 0%, #000 0%, transparent 55%);mask-image:radial-gradient(ellipse at 100% 0%, #000 0%, transparent 55%)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
::selection{background:rgba(255,111,174,.4)}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px 16px;border-right:1px solid var(--line);background:rgba(20,15,43,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font:600 14px var(--f-display);color:#1a0f35;
  background:linear-gradient(135deg,var(--yellow),var(--pink) 55%,var(--violet));box-shadow:0 6px 22px rgba(255,111,174,.35)}
.brand b{font:600 15px var(--f-display);display:block;letter-spacing:.01em}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;background:none;border:0;border-radius:12px;cursor:pointer;text-align:left;color:var(--muted);font-weight:600;transition:background .2s,color .2s}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:var(--text);background:linear-gradient(90deg,rgba(95,227,255,.18),rgba(155,123,255,.10));box-shadow:inset 0 0 0 1px rgba(95,227,255,.25)}
.nav button[aria-current="page"] svg{color:var(--cyan)}
.nav .badge{margin-left:auto;font:700 11px var(--f-mono);background:var(--pink);color:#2a0717;padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);padding:0 6px}
.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--dim);vertical-align:0}
.dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}
.dot.ai{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.dot.warn{background:var(--amber)}

main{padding:32px clamp(16px,3.2vw,44px) 90px;min-width:0;max-width:1280px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.eyebrow a{color:inherit;text-decoration:none}
.eyebrow.m{color:var(--pink)}
h1{font:600 clamp(23px,2.7vw,32px)/1.18 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 17px/1.35 var(--f-display);margin:0 0 12px}
h3{font:700 15px/1.4 var(--f-body);margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(95,227,255,.5)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.pri{background:linear-gradient(135deg,var(--cyan),#7d9bff);color:#0e0a26;border-color:transparent;box-shadow:0 6px 22px rgba(95,227,255,.28)}
.btn.pri:hover{box-shadow:0 8px 30px rgba(95,227,255,.45)}
.btn.ai{border-color:rgba(255,111,174,.45);color:#ffc2dc;background:rgba(255,111,174,.1)}
.btn.ai:hover{border-color:var(--pink);color:#fff;box-shadow:0 6px 22px rgba(255,111,174,.25)}
.btn.ai.solid{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border-color:transparent;box-shadow:0 6px 22px rgba(255,111,174,.32)}
.btn.pro{background:linear-gradient(135deg,var(--yellow),#ffb36b);color:#2a1a00;border-color:transparent;box-shadow:0 6px 22px rgba(255,228,107,.25)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.05)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn svg,.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:10px;cursor:pointer;transition:all .2s}
.ib:hover{border-color:var(--cyan);color:var(--cyan)}
.ib.live{border-color:var(--pink);color:var(--pink);box-shadow:0 0 16px rgba(255,111,174,.45)}
.lock{font:700 10px var(--f-mono);padding:1px 6px;border-radius:6px;background:var(--yellow);color:#2a1a00;letter-spacing:.04em}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.tag{display:inline-block;font:700 11px var(--f-body);letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted)}
.tag.ai{background:rgba(255,111,174,.16);color:#ffb3d3}
.tag.ex{background:rgba(255,228,107,.14);color:var(--yellow)}
.tag.ok{background:rgba(116,240,189,.14);color:var(--good)}
.tag.pro{background:rgba(255,228,107,.18);color:var(--yellow)}

input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],textarea,select{width:100%;background:rgba(10,6,28,.55);border:1px solid var(--line2);padding:10px 12px;border-radius:12px;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:90px;line-height:1.55}
select option{background:var(--panel-solid)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,227,255,.18)}
.lbl{display:block;font:700 12px var(--f-body);letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;padding:3px;gap:3px;background:rgba(10,6,28,.45);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{background:rgba(95,227,255,.16);color:var(--text);box-shadow:inset 0 0 0 1px rgba(95,227,255,.35)}
.seg button:disabled{opacity:.4}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-weight:600}
.switch input{appearance:none;width:40px;height:23px;border-radius:999px;background:var(--lv0);border:1px solid var(--line2);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked{background:rgba(95,227,255,.3);border-color:var(--cyan)}
.switch input:checked::after{transform:translateX(17px);background:var(--cyan)}

/* колоды */
.today{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;margin-bottom:24px;border-radius:var(--r);border:1px solid rgba(95,227,255,.2);background:linear-gradient(110deg,rgba(95,227,255,.12),rgba(155,123,255,.08) 50%,rgba(255,111,174,.06))}
.today b{font:600 24px var(--f-display);color:var(--cyan);font-variant-numeric:tabular-nums}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.deck{display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:transform .2s,border-color .2s}
.deck:hover{transform:translateY(-2px);border-color:rgba(95,227,255,.3)}
.deck h3{font:600 16px/1.35 var(--f-display)}
.kv{display:flex;gap:20px;font-size:12.5px;color:var(--muted)}
.kv b{display:block;font:700 19px var(--f-body);color:var(--text);font-variant-numeric:tabular-nums}
.kv b.due{color:var(--pink)}
.strip{display:flex;flex-wrap:wrap;gap:4px}
.strip i{width:15px;height:15px;border-radius:5px;background:var(--lv0)}
.lv-weak{background:var(--bad)!important}.lv-mid{background:var(--amber)!important}.lv-ok{background:var(--cyan)!important}.lv-none{background:var(--lv0)!important}
.newdeck{display:grid;place-items:center;min-height:180px;border:1.5px dashed var(--line2);border-radius:var(--r);background:none;color:var(--muted);cursor:pointer;font-weight:700;transition:all .2s}
.newdeck:hover{border-color:var(--cyan);color:var(--text);background:rgba(95,227,255,.05)}

/* колода */
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tabs button{background:none;border:0;padding:9px 16px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--text);background:rgba(255,255,255,.08)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.trow{display:grid;grid-template-columns:56px minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow.open{background:rgba(255,255,255,.04)}
.tnum{font:700 13px var(--f-mono);color:var(--cyan);background:rgba(95,227,255,.1);border-radius:10px;text-align:center;padding:5px 0}
.ttitle{font-weight:600;min-width:0}
.ttitle small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500}
.mbar{height:7px;border-radius:999px;background:var(--lv0);position:relative;overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;display:block;border-radius:999px}
.mlab{font-size:12px;color:var(--muted);margin-top:5px}
.tacts{display:flex;gap:6px;justify-content:flex-end}
.tcards{padding:8px 16px 18px 86px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.citem{border:1px solid var(--line);background:rgba(20,14,46,.55);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.citem .cq{font-weight:700}
.citem details summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted);list-style:none}
.citem details summary::before{content:"▸ ";color:var(--cyan)}
.citem details[open] summary::before{content:"▾ "}
.citem details[open] summary{margin-bottom:6px}
.cfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.src{font:600 12px var(--f-body);background:rgba(255,111,174,.12);border:1px solid rgba(255,111,174,.3);color:#ffc2dc;padding:3px 10px;border-radius:999px;cursor:pointer;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src:hover{border-color:var(--pink);color:#fff}
.chk{font:600 12px var(--f-body);border:1px dashed rgba(255,228,107,.5);color:var(--yellow);padding:3px 10px;border-radius:999px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:30px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:var(--r)}
.drop{display:block;border:1.5px dashed var(--line2);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted);cursor:pointer;transition:all .2s}
.drop.over,.drop:hover{border-color:var(--pink);background:rgba(255,111,174,.06);color:var(--text)}
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.mat:first-child{border-top:0}
.ftype{font:700 11px var(--f-mono);padding:7px 9px;border-radius:10px;background:rgba(95,227,255,.1);color:var(--cyan);min-width:50px;text-align:center}

/* повторение */
.rv-wrap{max-width:840px;margin:0 auto}
.rv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted)}
.prog{flex:1 1 140px;height:6px;border-radius:999px;background:var(--lv0);position:relative;min-width:120px;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}
.qcard{padding:30px 32px;min-height:210px}
.qcard .tl{font-size:12.5px;font-weight:700;color:var(--cyan);margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qtext{font-size:19.5px;font-weight:600;line-height:1.5}
.atext{margin-top:22px;padding-top:20px;border-top:1px solid var(--line2)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:14px;cursor:pointer;font-weight:700;transition:all .2s}
.grades button small{font-size:12px;color:var(--muted);font-weight:500}
.grades button kbd{font:10px var(--f-mono);color:var(--dim)}
.grades .g0:hover,.grades .g0.sug{border-color:var(--bad);color:var(--bad);background:rgba(255,123,149,.08)}
.grades .g1:hover,.grades .g1.sug{border-color:var(--amber);color:var(--amber);background:rgba(255,196,107,.08)}
.grades .g2:hover,.grades .g2.sug{border-color:var(--cyan);color:var(--cyan);background:rgba(95,227,255,.08)}
.grades .g3:hover,.grades .g3.sug{border-color:var(--good);color:var(--good);background:rgba(116,240,189,.08)}
.grades .sug{box-shadow:0 0 0 2px currentColor inset}
.answer-box{position:relative}
.answer-box textarea{min-height:120px;padding-right:50px}
.answer-box .ib{position:absolute;right:8px;top:8px}
.partial{font-size:13px;color:var(--pink);min-height:18px;margin-top:4px}
.aires{border:1px solid rgba(255,111,174,.3);background:linear-gradient(135deg,rgba(255,111,174,.08),rgba(155,123,255,.06));border-radius:var(--r);padding:16px 18px;margin-top:16px}
.score{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.score b{font:600 32px var(--f-display);font-variant-numeric:tabular-nums}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.res-grid h4{margin:0 0 4px;font-size:12.5px;font-weight:800;letter-spacing:.03em}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border:1px solid var(--line2);border-radius:999px;background:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--text);background:rgba(95,227,255,.12)}

/* экзамен */
.exam-ticket{border:1px solid var(--line2);border-radius:20px;background:linear-gradient(160deg,rgba(56,42,104,.7),rgba(30,22,62,.7));padding:26px 28px;position:relative;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.exam-ticket .hdr{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.exam-ticket .hdr b{font:600 20px var(--f-display)}
.timer{font:700 26px var(--f-mono);color:var(--cyan);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.eq{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.eq:first-of-type{border-top:0}
.eq .n{font:700 15px var(--f-mono);color:var(--pink)}
.mark{font:600 64px/1 var(--f-display);color:var(--cyan)}
.mark.m2{color:var(--bad)}.mark.m3{color:var(--amber)}.mark.m5{color:var(--good)}
.draw-anim{animation:draw .5s ease-out}
@keyframes draw{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.gen-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gen-list .exam-ticket{padding:18px 20px}
.gen-list ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.upsell{border:1px solid rgba(255,228,107,.35);background:linear-gradient(135deg,rgba(255,228,107,.10),rgba(255,111,174,.08));border-radius:20px;padding:26px 28px}
.upsell ul{margin:10px 0 18px;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* статистика */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.kpi{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;backdrop-filter:blur(14px)}
.kpi b{display:block;font:600 24px var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.heat button{aspect-ratio:1;border:0;border-radius:12px;cursor:pointer;font:700 13px var(--f-mono);color:rgba(20,12,44,.9);display:grid;place-items:center;transition:transform .15s}
.heat button.lv-none{color:var(--muted)}
.heat button:hover{transform:scale(1.08)}

const LIBS = {
  marked: ["vendor/marked.umd.js", "https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"],
  purify: ["vendor/purify.min.js", "https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"],

function loadOne(src) {

    .catch(() => { delete _libs[name]; throw new Error("Не загрузилась библиотека: проверь интернет"); }));
}

/* ============ состояние ============ */
let S = { decks: {}, materials: {}, meta: defaultMeta() };
const UI = { view: "decks", deckId: null, tab: "tickets", open: new Set(), busy: new Set(), q: "" };
const CAP = { tts: null, dict: null };
let cloudReady = false;
const dirty = new Set(), removed = new Set();
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
};
const API = ((window.BK_CONFIG && BK_CONFIG.apiBase) || "").replace(/\/$/, "");
/* Автономный режим: сайт открыт как файл (или так задано в config) и сервера нет. Нейросеть зовём напрямую, Pro открыт локально. */
const STANDALONE = location.protocol === "file:" || !!(window.BK_CONFIG && BK_CONFIG.standalone);
let ACC = LS.get("bk:auth", null);           // {token, user}
let AICFG = Object.assign({ provider: "deepseek", model: "", key: "", base_url: "", useServer: false }, LS.get("bk:ai", {}));
let PROVIDERS = {
  deepseek: { title: "DeepSeek", model: "deepseek-chat", vision: false },
  openai: { title: "OpenAI", model: "gpt-4o-mini", vision: true },
  anthropic: { title: "Claude (Anthropic)", model: "claude-haiku-5-5", vision: true },
  gemini: { title: "Google Gemini", model: "gemini-2.5-flash", vision: true },
  openrouter: { title: "OpenRouter (любые модели одним ключом)", model: "deepseek/deepseek-chat", vision: false },
  groq: { title: "Groq", model: "llama-3.3-70b-versatile", vision: false },
  mistral: { title: "Mistral", model: "mistral-small-latest", vision: false },
  custom: { title: "Другой (совместимый с OpenAI API)", model: "", vision: false },
};
const SERVER_OK = { v: null };

function deckList() { const ids = S.meta.order.filter(id => S.decks[id]); Object.keys(S.decks).forEach(id => { if (!ids.includes(id)) ids.push(id); }); return ids.map(id => S.decks[id]); }
function deckMaterials(deck) { return Object.values(S.materials).filter(m => m.deckId === deck.id).sort((a, b) => a.addedAt - b.addedAt); }
function chunkById(cid) { const [mid, n] = String(cid).split(":"); const m = S.materials[mid]; if (!m) return null; const c = m.chunks[+n]; return c == null ? null : { mat: m, n: +n, text: c }; }
function isPro() { return STANDALONE || !!(ACC && ACC.user && ACC.user.plan === "pro"); }
function serverAi() { return !STANDALONE && !!(AICFG.useServer && isPro() && ACC && ACC.user && ACC.user.server_ai); }
function aiOn() { return serverAi() || !!(AICFG.provider && (AICFG.provider === "custom" ? AICFG.base_url : AICFG.key)); }
function visionOn() { if (serverAi()) return true; const p = PROVIDERS[AICFG.provider]; return !!(p && (p.vision || AICFG.provider === "custom" || AICFG.provider === "openrouter")); }

/* --- сервер --- */
async function api(method, path, body, signal) {
  if (STANDALONE) throw { code: "offline", message: "Автономная версия: сервера нет" };
  const h = { "Content-Type": "application/json" };
  if (ACC && ACC.token) h.Authorization = "Bearer " + ACC.token;
  let r;
  try { r = await fetch(API + path, { method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined, signal }); }
  catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled" }; throw { code: "offline", message: "Нет связи с сервером. Проверь интернет" }; }
  let j = {}; try { j = await r.json(); } catch (e) { }
  if (!r.ok) {
    if (r.status === 401 && j.error === "auth" && ACC) { ACC = null; LS.set("bk:auth", null); updateSide(); }
    throw { code: j.error || "http_" + r.status, message: j.message || "Сервер ответил ошибкой " + r.status };
  }
  return j;
}
function setAccount(acc) { ACC = acc; LS.set("bk:auth", acc); updateSide(); }
async function refreshMe() {
  if (!ACC) return;
  try { const j = await api("GET", "/api/me"); setAccount({ token: ACC.token, user: j.user }); SERVER_OK.v = true; }
  catch (e) { if (e.code === "offline") SERVER_OK.v = false; }
}

/* --- сохранение: локально сразу, на сервер (Pro) пачками --- */
function touch(key) {
  _pristine = false; const now = Date.now();
  if (key === "meta") S.meta._upd = now;
  else if (key.startsWith("deck-") && S.decks[key.slice(5)]) S.decks[key.slice(5)]._upd = now;
  else if (key.startsWith("mat-") && S.materials[key.slice(4)]) S.materials[key.slice(4)]._upd = now;
  dirty.add(key); saveLocalSoon(); saveCloudSoon();
}
let _lt = 0, _ct = 0;
function saveLocalSoon() { clearTimeout(_lt); _lt = setTimeout(() => { try { localStorage.setItem("biletkart:v1", JSON.stringify(S)); } catch (e) { toast("Память браузера заполнена: удали большие материалы или включи синхронизацию", "err"); } }, 400); }
function saveCloudSoon() { clearTimeout(_ct); _ct = setTimeout(flushCloud, 1500); }
let _flushing = false;
async function flushCloud() {
  if (STANDALONE || !cloudReady || !isPro() || _flushing) return;
  _flushing = true;
  try {
    for (const key of Array.from(removed)) { removed.delete(key); try { await api("DELETE", "/api/sync/" + key); } catch (e) { if (e.code === "offline") { removed.add(key); break; } } }
    for (const key of Array.from(dirty)) {
      dirty.delete(key);
      let body = null;
      if (key === "meta") body = { kind: "meta", meta: S.meta };
      else if (key.startsWith("deck-")) { const d = S.decks[key.slice(5)]; if (d) body = { kind: "deck", deck: d }; }
      else if (key.startsWith("mat-")) { const m = S.materials[key.slice(4)]; if (m) body = { kind: "mat", mat: m }; }
      if (!body) continue;
      try { await api("PUT", "/api/sync/" + key, body); }
      catch (e) {
        if (e.code === "offline") { dirty.add(key); setSync("warn", "нет связи, сохраню позже"); break; }
        if (e.code === "need_pro") { cloudReady = false; break; }
        toast(e.message || "Не удалось синхронизировать", "err");
      }

async function syncPull() {
  if (!isPro()) { cloudReady = false; updateSide(); return; }
  setSync("warn", "синхронизация…");
  try {
    const { docs } = await api("GET", "/api/sync");
    if (_pristine && docs.length) { S = { decks: {}, materials: {}, meta: defaultMeta() }; }
    const seen = new Set();
    for (const d of docs) {
      const v = d.body || {}; seen.add(d.key);
      if (v.kind === "deck" && v.deck) { const loc = S.decks[v.deck.id]; if (!loc || (v.deck._upd || 0) > (loc._upd || 0)) S.decks[v.deck.id] = v.deck; else if ((loc._upd || 0) > (v.deck._upd || 0)) dirty.add(d.key); }
      else if (v.kind === "mat" && v.mat) { const loc = S.materials[v.mat.id]; if (!loc || (v.mat._upd || 0) > (loc._upd || 0)) S.materials[v.mat.id] = v.mat; else if ((loc._upd || 0) > (v.mat._upd || 0)) dirty.add(d.key); }
      else if (v.kind === "meta" && v.meta) { if ((v.meta._upd || 0) > (S.meta._upd || 0)) S.meta = Object.assign(defaultMeta(), v.meta); else if ((S.meta._upd || 0) > (v.meta._upd || 0)) dirty.add("meta"); }
    }
    if (!_pristine || !docs.length) {
      Object.keys(S.decks).forEach(id => { if (!seen.has("deck-" + id)) dirty.add("deck-" + id); });
      Object.keys(S.materials).forEach(id => { if (!seen.has("mat-" + id)) dirty.add("mat-" + id); });
      if (!seen.has("meta")) dirty.add("meta");
    }

    if (["decks", "deck", "stats"].includes(UI.view)) render();
    flushCloud();

}
function setSync(kind, text) { const el = $("#syncStat"); if (el) el.innerHTML = `<span class="dot ${kind}"></span>данные: ${esc(text)}`; }
function updateSide() {
  const p = $("#planStat"); if (p) p.innerHTML = ACC ? (isPro() ? `<span class="lock">PRO</span> ${esc(ACC.user.name || ACC.user.email)}` : esc(ACC.user.name || ACC.user.email)) : "без аккаунта";

function defaultMeta() { return { order: [], days: {}, exams: [], newToday: {}, settings: { newPerSession: 20, rate: 1 } }; }
let _pristine = true;

/* ============ интервальные повторения (упрощённый SM-2) ============ */
function schedule(c, g, preview = false) {
  let ivl = c.ivl || 0, ease = c.ease || 2.5, reps = c.reps || 0;
  if (g === 0) { reps = 0; ivl = 10 / 1440; ease = Math.max(1.3, ease - 0.2); }
  else {
    if (reps === 0) ivl = g === 1 ? 1 : g === 2 ? 1 : 3;
    else if (reps === 1) ivl = g === 1 ? 2 : g === 2 ? 4 : 6;
    else ivl = Math.max(ivl + 1, ivl * ease * (g === 1 ? 0.55 : g === 3 ? 1.3 : 1));
    ease = clamp(ease + (g === 1 ? -0.15 : g === 3 ? 0.15 : 0), 1.3, 3.2);
    reps++;
  }
  if (preview) return ivl;
  c.ivl = ivl; c.ease = ease; c.reps = reps; c.lapses = (c.lapses || 0) + (g === 0 ? 1 : 0);

  c.hist = (c.hist || []).concat(g).slice(-6);
}
function cardMastery(c) {
  if (!c.hist || !c.hist.length) return null;
  let s = 0, w = 0; c.hist.slice(-5).forEach((g, i) => { s += (i + 1) * (g / 3); w += i + 1; });
  let m = s / w;
  if (c.due && Date.now() > c.due) m *= Math.max(0.55, 1 - ((Date.now() - c.due) / DAY) * 0.04);
  return m;
}
function ticketStat(deck, t) {

function retrieve(deck, query, k = 6) {
  const all = []; deckMaterials(deck).forEach(m => m.chunks.forEach((text, n) => all.push({ id: m.id + ":" + n, mat: m, n, text })));
  if (!all.length) return [];
  const docs = all.map(c => { const tf = new Map(); toks(c.text).forEach(w => tf.set(w, (tf.get(w) || 0) + 1)); return tf; });
  const df = new Map(); docs.forEach(tf => tf.forEach((v, w) => df.set(w, (df.get(w) || 0) + 1)));
  const q = Array.from(new Set(toks(query))); const N = all.length;
  const scored = all.map((c, i) => { let s = 0; q.forEach(w => { const tf = docs[i].get(w); if (tf) s += Math.log(1 + N / df.get(w)) * (1 + Math.log(tf)); }); return { c, s }; }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const pick = scored.slice(0, k).map(x => x.c);
  if (pick[0]) { const nb = all.find(c => c.mat === pick[0].mat && c.n === pick[0].n + 1); if (nb && !pick.includes(nb) && pick.length < k + 1) pick.push(nb); }
  let total = 0; return pick.filter(c => (total += c.text.length) < 14000);
}

async function genTicket(deckId, tid, signal) {

      d.cards.push({ id: "c" + uid(), t: tid, q: p.Q, a: p.A, src: ids, quote: (p.QUOTE || "").replace(/^["«]|["»]$/g, ""), check: (p.CHECK || "").split(/[;\n]/).map(s => s.replace(/^[-–\s]+/, "").trim()).filter(s => s && !/^нет\.?$/i.test(s)).slice(0, 5), ai: true, hist: [], reps: 0, ivl: 0, ease: 2.5, due: 0, createdAt: Date.now() });
      n++;

    return n;

}

/* --- материалы --- */
function chunkText(text) {
  text = String(text || "").replace(/\r/g, "").replace(/ /g, " ").replace(/[ \t]+\n/g, "\n");
  const paras = text.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(p => p.length > 1);
  const out = []; let buf = "";
  const flush = () => { if (buf.trim()) out.push(buf.trim()); buf = ""; };
  for (const p of paras) {
    if (p.length > 1100) {
      flush(); const sents = p.match(/[^.!?…]+[.!?…]+["»)\]]*\s*|[^.!?…]+$/g) || [p]; let b = "";
      for (const s of sents) { if ((b + s).length > 800 && b) { out.push(b.trim()); b = ""; } b += s; }
      if (b.trim()) out.push(b.trim());
    } else if (buf && (buf.length + p.length) > 800) { flush(); buf = p; }
    else buf = buf ? buf + "\n" + p : p;
  }
  flush(); return out;
}
function addMaterialText(d, name, kind, text) {
  const chunks = chunkText(text);
  if (!chunks.length) { toast(`В «${name}» не нашлось текста`, "err"); return 0; }
  const parts = []; let cur = [], size = 0;
  for (const c of chunks) { if (size + c.length > 140000 && cur.length) { parts.push(cur); cur = []; size = 0; } cur.push(c); size += c.length; }
  if (cur.length) parts.push(cur);
  parts.forEach((p, i) => { const id = "m" + uid(); S.materials[id] = { id, deckId: d.id, name: parts.length > 1 ? `${name} (ч. ${i + 1})` : name, kind, addedAt: Date.now() + i, chunks: p }; touch("mat-" + id); });
  return chunks.length;
}
async function pdfToText(file) {
  await loadLib("pdfw"); await loadLib("pdf");
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBSRC.pdfw;
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    MATBUSY = `Читаю ${file.name}: страница ${p} из ${pdf.numPages}`; if (UI.view === "deck" && p % 5 === 1) render();
    const tc = await (await pdf.getPage(p)).getTextContent();
    let line = "", lines = [], eol = tc.items.some(i => i.hasEOL);
    for (const it of tc.items) { line += it.str; if (it.hasEOL) { lines.push(line); line = ""; } else if (!eol) line += " "; }
    if (line) lines.push(line);
    pages.push(lines.join("\n"));
  }
  return pages.join("\n\n");
}

function weightedPick(d, k) {
  const pool = d.tickets.map(t => ({ t, w: 1.25 - (ticketStat(d, t).m ?? 0.45) }));

  while (out.length < k && pool.length) { const tot = sum(pool.map(p => p.w)); let r = Math.random() * tot, i = 0; for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; } out.push(pool[i].t); pool.splice(i, 1); }
  return out.sort((a, b) => a.num - b.num);
}

<script>
/* ============ модальные окна ============ */
function parseTicketList(text) {
  const out = []; let auto = 1;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim().replace(/^[-•*]\s+/, ""); if (!line) continue;
    const m = line.match(/^(?:билет|вопрос|тема)?\s*№?\s*(\d{1,3})\s*[.):\-–—|]?\s+(.{3,})$/i);
    if (m) { out.push({ num: +m[1], title: m[2].trim() }); auto = +m[1] + 1; }
    else if (line.length > 3) out.push({ num: auto++, title: line });
  }
  return out;
}
function addTickets(d, list) {
  let add = 0, skip = 0;
  for (const it of list) { if (d.tickets.some(t => t.num === it.num)) { skip++; continue; } d.tickets.push({ id: "t" + uid(), num: it.num, title: it.title }); add++; }
  touch("deck-" + d.id); return { add, skip };
}

    S.decks[id] = d; S.meta.order.unshift(id); addTickets(d, parseTicketList($("#ndList", m).value)); touch("meta");
    closeModal(); UI.tab = d.tickets.length ? "mats" : "tickets"; go("deck", id);

}
function modalDeckSettings(d) {

function modalImport(d) {

}
function modalTicket(d, t) {
  const next = d.tickets.length ? Math.max(...d.tickets.map(x => x.num)) + 1 : 1;
  const m = openModal(`<div class="modal-h"><div><div class="eyebrow">${t ? "билет" : "новый билет"}</div><h2>${t ? "Билет №" + t.num : "Добавить билет"}</h2></div><button class="ib" data-act="close" aria-label="Закрыть">✕</button></div>

    <div class="grow"><label class="lbl" for="tkTitle">Формулировка</label><textarea id="tkTitle" rows="3" autofocus>${t ? esc(t.title) : ""}</textarea></div></div>

}
const SNIPS = [
  ["\\(x\\)", "\\(", "\\)", "формула в строке"], ["\\[ \\]", "\n\\[\n", "\n\\]\n", "формула блоком"],
  ["дробь", "\\frac{", "}{}", "\\frac{a}{b}"], ["√", "\\sqrt{", "}", "корень"], ["∫", "\\int_{a}^{b} ", " \\,dx", "интеграл"], ["Σ", "\\sum_{n=1}^{\\infty} ", "", "сумма"],
  ["lim", "\\lim_{x\\to 0} ", "", "предел"], ["матрица", "\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}", "", "матрица 2×2"],
  ["H₂O", "\\ce{", "}", "химия: \\ce{2H2 + O2 -> 2H2O}"], ["код", "\n```python\n", "\n```\n", "блок кода"],
  ["схема", "\n```mermaid\nflowchart LR\n  A[Начало] --> B[Шаг] --> C[Итог]\n```\n", "", "схема Mermaid"], ["график", "\n```graph\ny = sin(x)\nx: -6..6\n```\n", "", "график функции"],
  ["таблица", "\n| Термин | Определение |\n|---|---|\n|  |  |\n", "", "таблица"], ["**Ж**", "**", "**", "жирный"],

        <code>\\ce{CH4 + 2O2 -> CO2 + 2H2O}</code><span>химическая реакция</span><code>\`\`\`python</code><span>код с подсветкой</span>
        <code>\`\`\`mermaid</code><span>схема: flowchart, sequenceDiagram</span><code>\`\`\`graph</code><span>график: строки y = ..., x: -5..5</span>
        <code>| a | b |</code><span>таблица Markdown</span></div></details>
    </div><div><div class="lbl">Предпросмотр</div><div class="preview" id="cePrev"></div></div></div>
    <div class="modal-f"><button class="btn ghost" data-act="close">Отмена</button><button class="btn pri" id="ceOk">Сохранить</button></div>`, { wide: true });
  const q = $("#ceQ", m), a = $("#ceA", m), prev = $("#cePrev", m); let last = a, tm = 0;
  const upd = () => { clearTimeout(tm); tm = setTimeout(() => { prev.innerHTML = `<div class="rich" style="font-weight:600;margin-bottom:10px">${renderRich(q.value || "_вопрос_")}</div><div class="rich" style="border-top:1px dashed var(--line2);padding-top:10px">${renderRich(a.value || "_ответ_")}</div>`; hydrate(prev); }, 280); };
  [q, a].forEach(el => { el.addEventListener("input", upd); el.addEventListener("focus", () => last = el); });
  $$("[data-snip]", m).forEach(b => b.onclick = () => { const s = SNIPS[+b.dataset.snip], el = last, st = el.selectionStart, en = el.selectionEnd, sel = el.value.slice(st, en); el.value = el.value.slice(0, st) + s[1] + sel + s[2] + el.value.slice(en); el.focus(); const pos = st + s[1].length + sel.length; el.setSelectionRange(pos, pos); upd(); });

  "edit-ticket": el => { const d = S.decks[UI.deckId]; modalTicket(d, ticketOf(d, el.dataset.tid)); },
  "toggle-ticket": el => { const id = el.dataset.tid; UI.open.has(id) ? UI.open.delete(id) : UI.open.add(id); render(); },
  "gen-ticket": async el => { try { const n = await genTicket(UI.deckId, el.dataset.tid); toast(n ? `ИИ создал ${pl(n, "карточку", "карточки", "карточек")}` : "Карточки не созданы, причина под билетом", n ? "ai" : "err"); if (!n) { UI.open.add(el.dataset.tid); render(); } } catch (e) { if (e.code !== "cancelled") toast(aiErrText(e), "err"); } },
  "gen-all": () => genAll(S.decks[UI.deckId]),
  "batch-stop": () => { if (BATCH) BATCH.ctl.abort(); },
  "add-card": el => modalCard(S.decks[UI.deckId], null, el.dataset.tid),
  "edit-card": el => { const f = findCard(el.dataset.cid); if (f) modalCard(f.d, f.c); },
  "del-card": el => { const f = findCard(el.dataset.cid); if (!f) return; const i = f.d.cards.indexOf(f.c); f.d.cards.splice(i, 1); _lastDel = { d: f.d, c: f.c, i }; touch("deck-" + f.d.id); render(); toast("Карточка удалена", "", { label: "Вернуть", fn: () => { if (_lastDel) { _lastDel.d.cards.splice(_lastDel.i, 0, _lastDel.c); touch("deck-" + _lastDel.d.id); _lastDel = null; render(); } } }); },
  "show-src": el => modalSrc(el.dataset.cid, el.dataset.card),
  "view-mat": el => modalMat(el.dataset.mid, el.dataset.n != null ? +el.dataset.n : null),
  "del-mat": el => { const mt = S.materials[el.dataset.mid]; if (!mt) return; delete S.materials[mt.id]; removed.add("mat-" + mt.id); dirty.delete("mat-" + mt.id); saveLocalSoon(); saveCloudSoon(); render(); toast(`«${mt.name}» удалён`, "", { label: "Вернуть", fn: () => { S.materials[mt.id] = mt; removed.delete("mat-" + mt.id); touch("mat-" + mt.id); render(); } }); },
  "paste-mat": () => modalPaste(S.decks[UI.deckId]),
  mic: el => toggleMic(el),
  speak: el => { const cur = rvCur(); if (!cur) return; speak(el.dataset.what === "qa" ? cur.c.q + ". Ответ. " + cur.c.a : cur.c.q, el); },
  explain: () => explainCard(),
  "rv-deck": el => { const id = el.dataset.deck, s = new Set(RVSET.decks); s.has(id) ? s.delete(id) : s.add(id); RVSET.decks = Array.from(s); render(); },
  "rv-mode": el => { RVSET.mode = el.dataset.mode; render(); },
  "rv-method": el => { RVSET.method = el.dataset.method; render(); },
  "rv-start": () => startReview(RVSET.decks.filter(id => S.decks[id]), RVSET.mode, RVSET.method),
  "rv-reveal": () => { if (RV) { RV.answer = ($("#rvAns")?.value || "").trim(); RV.revealed = true; render(); } },
  "rv-check": () => rvCheck(),
  "rv-grade": el => rvGrade(+el.dataset.g),
  "rv-exit": () => { RV = null; render(); },
  "rv-weak-again": () => startReview(RV ? RV.deckIds : deckList().map(d => d.id), "weak", RV ? RV.method : RVSET.method),
  "weak-all": () => startReview(deckList().map(d => d.id), "weak", RVSET.method),
  "audio-run": () => audioRun(),
  "open-ticket": el => { UI.open.add(el.dataset.tid); UI.tab = "tickets"; go("deck", el.dataset.deck); setTimeout(() => $("#tr-" + el.dataset.tid)?.scrollIntoView({ block: "center" }), 60); },
  "ex-deck": el => { EXSET.deckId = el.dataset.deck; GEN = null; if (EXSET.k > S.decks[el.dataset.deck].tickets.length) EXSET.k = 1; render(); },
  "ex-min": el => { EXSET.minutes = +el.dataset.v; render(); },
  "ex-k": el => { EXSET.k = +el.dataset.v; render(); },
  "gen-k": el => { GENSET.k = +el.dataset.v; GENSET.n = clamp(parseInt($("#genN")?.value, 10) || GENSET.n, 2, 40); render(); },
  "ex-draw": () => { if (EX && EX.state === "done") EXSET.deckId = EX.deckId; drawTicket(); },
  "ex-submit": () => submitExam(),
  "ex-cancel": () => { EX = null; clearInterval(_exTimer); render(); },
  "ex-self": () => { EX.state = "self"; render(); },
  "ex-selfmark": el => { const mk = +el.dataset.v, d = S.decks[EX.deckId]; saveExam(d, null, Math.round((mk - 2) / 3 * 100), mk); EX.res = { items: [], total: Math.round((mk - 2) / 3 * 100), mark: mk, comment: "Самооценка без ИИ.", extra: "" }; EX.state = "done"; render(); },
  "ex-extra": () => extraAnswer(),
  "ex-finish": () => { EX.state = "done"; render(); },
  "gen-set": () => genSet(true),
  "gen-local": () => genSet(false),
  "gen-copy": () => { if (!GEN || !GEN.list) return; const txt = `${exDeck().name}\n\n` + GEN.list.map((t, i) => `Билет №${i + 1}\n` + t.map((q, j) => `${j + 1}. ${q}`).join("\n")).join("\n\n"); navigator.clipboard.writeText(txt).then(() => toast("Скопировано")).catch(() => { openModal(`<div class="modal-h"><h2>Скопируй вручную</h2><button class="ib" data-act="close" aria-label="Закрыть">✕</button></div><textarea rows="16" readonly>${esc(txt)}</textarea>`); }); },
};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]"); if (nav) { go(nav.dataset.nav); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.tagName === "ARTICLE" && e.target.closest("button,a,input") && e.target.closest("button,a,input") !== a) return;
  e.preventDefault(); fn(a, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modalRoot").firstChild) { closeModal(); return; }
  if ($("#modalRoot").firstChild) return;
  const tgt = e.target, typing = tgt.matches && tgt.matches("textarea,input,select");
  if (e.key === "Enter" && tgt.matches && tgt.matches("article[data-act]")) { ACT["open-deck"](tgt); return; }
  if (UI.view === "review" && RV && rvCur()) {
    if (tgt.id === "rvAns" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); rvCheck(); return; }
    if (typing) return;
    if (e.key === " " && !RV.revealed) { e.preventDefault(); ACT["rv-reveal"](); }
    else if (RV.revealed && ["1", "2", "3", "4"].includes(e.key)) rvGrade(+e.key - 1);
  }
});
document.addEventListener("input", e => { if (e.target.id === "tq") { UI.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#tq"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } } });
document.addEventListener("change", e => {
  if (e.target.id === "fileIn" && e.target.files.length) addFiles(S.decks[UI.deckId], e.target.files);
  if (e.target.id === "exTask") EXSET.task = e.target.checked;
  if (e.target.id === "genTask") GENSET.task = e.target.checked;
  if (e.target.id === "genN") GENSET.n = clamp(parseInt(e.target.value, 10) || 10, 2, 40);
});
["dragover", "dragenter"].forEach(ev => document.addEventListener(ev, e => { const dz = e.target.closest && e.target.closest("#drop"); if (dz) { e.preventDefault(); dz.classList.add("over"); } }));
document.addEventListener("dragleave", e => { const dz = e.target.closest && e.target.closest("#drop"); if (dz) dz.classList.remove("over"); });
document.addEventListener("drop", e => { const dz = e.target.closest && e.target.closest("#drop"); if (!dz) return; e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files.length) addFiles(S.decks[UI.deckId], e.dataTransfer.files); });

</script>
<script>
/* ============ экран: профиль ============ */
const PF = { auth: "login", test: null, testing: false, showKey: false, busy: false };
let AIDRAFT = null, INSTALL = null;
const KEY_HELP = {
  deepseek: ["platform.deepseek.com", "https://platform.deepseek.com/api_keys"],
  openai: ["platform.openai.com", "https://platform.openai.com/api-keys"],
  anthropic: ["console.anthropic.com", "https://console.anthropic.com/settings/keys"],
  gemini: ["aistudio.google.com", "https://aistudio.google.com/apikey"],
  openrouter: ["openrouter.ai", "https://openrouter.ai/keys"],
  groq: ["console.groq.com", "https://console.groq.com/keys"],
  mistral: ["console.mistral.ai", "https://console.mistral.ai/api-keys"],
};
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL = e; if (UI.view === "profile") render(); });

function vProfile() {
  if (!AIDRAFT) AIDRAFT = Object.assign({}, AICFG);
  const u = ACC && ACC.user, pro = isPro();
  const P = PROVIDERS[AIDRAFT.provider] || PROVIDERS.custom, help = KEY_HELP[AIDRAFT.provider];
  const acc = STANDALONE ? `<p class="note" style="margin:0">Автономная версия. Аккаунтов и синхронизации здесь нет: колоды хранятся в этом браузере. Все функции, включая Pro, открыты. Для синхронизации между устройствами открой версию с сервером.</p>`
    : u ? `<div class="stack"><div><b>${esc(u.name || "Без имени")}</b><div class="muted">${esc(u.email)}</div></div>
      <div class="row">${pro ? `<span class="tag pro">PRO до ${new Date(u.pro_until * 1000).toLocaleDateString("ru-RU")}</span>` : `<span class="tag">Бесплатный тариф</span>`}<span class="grow"></span><button class="btn sm ghost" data-act="logout">Выйти</button></div></div>`
    : `<div class="stack"><div class="seg">${[["login", "Вход"], ["register", "Регистрация"]].map(([k, l]) => `<button data-act="auth-mode" data-v="${k}" aria-pressed="${PF.auth === k}">${l}</button>`).join("")}</div>
      <form id="authForm" class="stack" autocomplete="on">
        ${PF.auth === "register" ? `<div><label class="lbl" for="auName">Имя</label><input type="text" id="auName" autocomplete="name"></div>` : ""}
        <div><label class="lbl" for="auEmail">Email</label><input type="email" id="auEmail" autocomplete="email" required></div>
        <div><label class="lbl" for="auPw">Пароль</label><input type="password" id="auPw" autocomplete="${PF.auth === "register" ? "new-password" : "current-password"}" required minlength="6"></div>
        <div><button class="btn pri" type="submit" ${PF.busy ? "disabled" : ""}>${PF.busy ? `<span class="spin"></span>` : ""}${PF.auth === "register" ? "Создать аккаунт" : "Войти"}</button></div>
      </form><p class="note">Без аккаунта всё работает на этом устройстве. Аккаунт нужен для Pro и синхронизации.</p></div>`;
  const plan = STANDALONE ? `<p class="muted" style="margin:0">В автономной версии Pro открыт: симулятор экзамена, генератор билетов и аудио-прогон работают без подписки.</p>`
    : pro ? `<p class="muted" style="margin:0">Pro активен. Колоды синхронизируются между устройствами, симулятор экзамена и аудио-прогон открыты.</p>`
    : `<div class="upsell" style="padding:18px 20px"><b>Что даёт Pro</b><ul style="margin:8px 0 0"><li>Синхронизация между телефоном и компьютером</li><li>Симулятор экзамена и генератор билетов</li><li>Аудио-прогон карточек</li>${ACC && ACC.user && SERVER_OK.v !== false ? "" : ""}</ul></div>
      <p class="note">Оплата картой появится позже. Сейчас Pro включается промокодом.</p>
      <div class="keyrow"><input type="text" id="promo" placeholder="Промокод" aria-label="Промокод" ${u ? "" : "disabled"}><button class="btn pro" data-act="redeem" ${u ? "" : "disabled"}>Активировать</button></div>
      ${u ? "" : `<p class="note">Чтобы активировать промокод, войди в аккаунт.</p>`}`;
  const srvAi = pro && u && u.server_ai;
  const aiSec = `${srvAi ? `<label class="switch"><input type="checkbox" id="aiServer" ${AIDRAFT.useServer ? "checked" : ""}> Встроенный ИИ (без своего ключа)</label>` : ""}
    <div class="stack" ${srvAi && AIDRAFT.useServer ? "hidden" : ""}>
      <div><label class="lbl" for="aiProv">Провайдер</label><select id="aiProv">${Object.entries(PROVIDERS).map(([k, p]) => `<option value="${k}" ${k === AIDRAFT.provider ? "selected" : ""}>${esc(p.title)}</option>`).join("")}</select></div>
      ${AIDRAFT.provider === "custom" ? `<div><label class="lbl" for="aiBase">Адрес API</label><input type="url" id="aiBase" value="${esc(AIDRAFT.base_url)}" placeholder="https://.../v1"></div>` : ""}
      <div><label class="lbl" for="aiModel">Модель</label><input type="text" id="aiModel" value="${esc(AIDRAFT.model)}" placeholder="${esc(P.model || "название модели")}"><p class="note" style="margin-top:4px">Оставь пустым, чтобы взять модель по умолчанию. Названия моделей у провайдеров меняются: актуальные смотри в их документации.</p></div>
      <div><label class="lbl" for="aiKey">API-ключ</label><div class="keyrow"><input type="${PF.showKey ? "text" : "password"}" id="aiKey" value="${esc(AIDRAFT.key)}" placeholder="sk-..." autocomplete="off" spellcheck="false"><button class="ib" data-act="key-toggle" title="${PF.showKey ? "Скрыть" : "Показать"} ключ" aria-label="Показать или скрыть ключ">${PF.showKey ? "◡" : "◉"}</button></div>
        ${help ? `<p class="note" style="margin-top:4px">Ключ создаётся в личном кабинете: <a href="${help[1]}" target="_blank" rel="noopener">${help[0]}</a></p>` : ""}</div>
      ${P.vision ? `<p class="note">Эта модель понимает фото конспектов.</p>` : AIDRAFT.provider === "custom" || AIDRAFT.provider === "openrouter" ? "" : `<p class="note">Фото конспектов эта модель не распознаёт. Для фото выбери Claude, OpenAI или Gemini.</p>`}
    </div>
    <p class="note">Ключ хранится только на этом устройстве и не синхронизируется. Сервер передаёт запрос провайдеру и ключ не сохраняет.</p>
    ${PF.test ? `<div class="${PF.test.ok ? "okline" : "errline"}">${esc(PF.test.msg)}</div>` : ""}
    <div class="row"><button class="btn pri" data-act="ai-save">Сохранить</button><button class="btn" data-act="ai-test" ${PF.testing ? "disabled" : ""}>${PF.testing ? `<span class="spin"></span> Проверяю…` : "Проверить подключение"}</button></div>`;
  const rate = (S.meta.settings && S.meta.settings.rate) || 1;
  return `<header class="vh"><div><div class="eyebrow">профиль</div><h1>Профиль и настройки</h1></div>
      ${INSTALL ? `<button class="btn pri" data-act="install">Установить приложение</button>` : ""}</header>
    <div class="set-grid">
      <section class="panel stack" id="accSec"><h2 style="margin:0">Аккаунт</h2>${acc}</section>
      <section class="panel stack" id="aiSec"><div class="row"><h2 style="margin:0" class="grow">Нейросеть</h2>${aiOn() ? `<span class="tag ai">подключена</span>` : `<span class="tag">не подключена</span>`}</div>${aiSec}</section>
      <section class="panel stack" id="proSec"><div class="row"><h2 style="margin:0" class="grow">Подписка</h2><span class="tag ${pro ? "pro" : ""}">${pro ? "PRO" : "Free"}</span></div>${plan}</section>
      <section class="panel stack"><h2 style="margin:0">Голос</h2>
        ${CAP.tts ? `<div><div class="lbl">Скорость озвучки</div><div class="seg">${[0.8, 1, 1.2, 1.4].map(r => `<button data-act="voice-rate" data-v="${r}" aria-pressed="${rate === r}">${r}×</button>`).join("")}</div></div>
        <div><button class="btn" data-act="voice-test">${ICON.spk} Проверить озвучку</button></div>` : `<p class="note">Озвучка недоступна в этом браузере.</p>`}
        <p class="note">${CAP.dict ? "Ответы можно надиктовывать: кнопка с микрофоном рядом с полем ответа." : "Голосовой ввод в этом браузере недоступен. Он работает в Chrome и в приложении для Android."}</p></section>
      <section class="panel stack"><h2 style="margin:0">Данные</h2>
        <p class="note">Резервная копия — один файл со всеми колодами, материалами и статистикой. Пригодится, чтобы перенести данные без Pro.</p>
        <div class="row"><button class="btn" data-act="backup-export">Скачать копию</button><label class="btn" for="bkIn">Восстановить из файла</label><input type="file" id="bkIn" accept=".json,application/json" hidden></div>
        ${deckList().some(d => d.demo) ? `<div><button class="btn sm ghost danger" data-act="del-demo">Удалить колоды-примеры</button></div>` : ""}
      </section>
    </div>`;
}
function readAiForm() {
  if (!AIDRAFT) return;
  const g = id => { const el = $("#" + id); return el ? el.value.trim() : null; };
  const v = { provider: g("aiProv"), model: g("aiModel"), key: g("aiKey"), base_url: g("aiBase") };
  for (const k in v) if (v[k] != null) AIDRAFT[k] = v[k];
  const sv = $("#aiServer"); if (sv) AIDRAFT.useServer = sv.checked;
}
async function authSubmit() {
  const email = $("#auEmail").value.trim(), password = $("#auPw").value, name = $("#auName") ? $("#auName").value.trim() : "";
  PF.busy = true; render();
  try {
    const j = await api("POST", PF.auth === "register" ? "/api/auth/register" : "/api/auth/login", { email, password, name });
    setAccount({ token: j.token, user: j.user });
    toast(PF.auth === "register" ? "Аккаунт создан" : "С возвращением!");
    if (isPro()) syncPull();
  } catch (e) { toast(e.message || "Не получилось", "err"); }
  PF.busy = false; render();
}
Object.assign(ACT, {
  "goto-ai": () => { closeModal(); go("profile"); setTimeout(() => $("#aiSec")?.scrollIntoView({ block: "start", behavior: "smooth" }), 60); },
  "goto-pro": () => { closeModal(); go("profile"); setTimeout(() => $(ACC ? "#proSec" : "#accSec")?.scrollIntoView({ block: "start", behavior: "smooth" }), 60); },
  "auth-mode": el => { PF.auth = el.dataset.v; render(); },
  logout: async () => { try { await api("POST", "/api/auth/logout"); } catch (e) { } cloudReady = false; setAccount(null); toast("Ты вышел из аккаунта. Данные остались на устройстве"); render(); },
  redeem: async () => {
    const code = ($("#promo")?.value || "").trim(); if (!code) return;
    try { const j = await api("POST", "/api/billing/redeem", { code }); setAccount({ token: ACC.token, user: j.user }); toast("Pro активирован", "ai"); syncPull(); render(); }
    catch (e) { toast(e.message || "Не получилось", "err"); }
  },
  "key-toggle": () => { readAiForm(); PF.showKey = !PF.showKey; render(); },
  "ai-save": () => { readAiForm(); AICFG = Object.assign({}, AIDRAFT); LS.set("bk:ai", AICFG); updateSide(); PF.test = null; toast("Настройки нейросети сохранены"); render(); },
  "ai-test": async () => {
    readAiForm(); PF.testing = true; PF.test = null; render();
    const d = AIDRAFT, body = d.useServer && isPro() ? { use_server_ai: true } : { provider: d.provider, model: d.model, key: d.key, base_url: d.base_url };
    try { const t = STANDALONE ? await directAI(d, "Ответь одним словом: работает", [], 20) : (await api("POST", "/api/ai/test", body)).text; PF.test = { ok: true, msg: "Работает. Ответ модели: " + String(t).slice(0, 100) }; }
    catch (e) { PF.test = { ok: false, msg: aiErrText(e) }; }
    PF.testing = false; render();
  },
  "voice-rate": el => { S.meta.settings.rate = +el.dataset.v; touch("meta"); render(); },
  "voice-test": el => speak("Привет! Так будут звучать вопросы и ответы твоих карточек.", el),
  "backup-export": () => exportBackup(),
  "del-demo": () => { deckList().filter(d => d.demo).forEach(d => { deckMaterials(d).forEach(m => { delete S.materials[m.id]; removed.add("mat-" + m.id); dirty.delete("mat-" + m.id); }); delete S.decks[d.id]; removed.add("deck-" + d.id); dirty.delete("deck-" + d.id); }); S.meta.order = S.meta.order.filter(id => S.decks[id]); touch("meta"); render(); toast("Примеры удалены"); },
  install: async () => { if (!INSTALL) return; INSTALL.prompt(); try { await INSTALL.userChoice; } catch (e) { } INSTALL = null; render(); },
});
document.addEventListener("submit", e => { if (e.target.id === "authForm") { e.preventDefault(); authSubmit(); } });
document.addEventListener("change", e => {
  if (e.target.id === "aiProv") { readAiForm(); AIDRAFT.model = ""; PF.test = null; render(); }
  if (e.target.id === "aiServer") { readAiForm(); render(); }
  if (e.target.id === "bkIn" && e.target.files[0]) importBackup(e.target.files[0]);
});
</script>
<script>
/* ============ запуск ============ */
(async function boot() {
  let loaded = null;
  try { const raw = localStorage.getItem("biletkart:v1"); if (raw) loaded = JSON.parse(raw); } catch (e) { }
  if (loaded && loaded.decks) { S = loaded; S.meta = Object.assign(defaultMeta(), S.meta || {}); S.meta.settings = Object.assign(defaultMeta().settings, S.meta.settings || {}); S.materials = S.materials || {}; _pristine = false; }
  else S = makeDemo();
  CAP.tts = makeTTS(); CAP.dict = makeDict(); if (CAP.dict) wireDictation(CAP.dict);
  updateSide();
  window.addEventListener("hashchange", route);
  await Promise.race([Promise.all([loadLib("marked"), loadLib("purify"), loadLib("hljs")]).catch(() => { }), new Promise(r => setTimeout(r, 4000))]);
  configLibs();
  route();
  loadLib("mathjax").catch(() => { });
  api("GET", "/api/config").then(c => { SERVER_OK.v = true; if (c.providers) for (const k in c.providers) PROVIDERS[k] = Object.assign(PROVIDERS[k] || {}, c.providers[k]); if (UI.view === "profile") render(); }).catch(() => { SERVER_OK.v = false; });
  if (ACC) { await refreshMe(); if (isPro()) syncPull(); if (UI.view === "profile") render(); }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && isPro()) syncPull(); });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !isNative()) navigator.serviceWorker.register("sw.js").catch(() => { });
})();
</script>
